name: Android CI & Unit Tests

on:
  push:
    branches: [ "test/week5", "main" ]
  pull_request:
    branches: [ "test/week5", "main" ]

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Successfully restored app/google-services.json from GitHub Secrets."
          else
            echo "Warning: GOOGLE_SERVICES_JSON secret not set. Creating dummy google-services.json for build..."
            mkdir -p app
            cat << 'EOF' > app/google-services.json
            {
              "project_info": { "project_number": "123456789012", "project_id": "vocalens-dummy", "storage_bucket": "vocalens-dummy.appspot.com" },
              "client": [{
                "client_info": { "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890", "android_client_info": { "package_name": "com.luudev.vocalens" } },
                "oauth_client": [], "api_key": [{ "current_key": "dummy_api_key" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }],
              "configuration_version": "1"
            }
            EOF
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Upload Test Reports (HTML & XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
